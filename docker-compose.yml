services:
  chromadb:
    # Pinned to 1.5.9 (latest stable 1.x, API v2 only — matches the JS client
    # chromadb@^3.4.3 in package.json, which requires server >= 1.0).
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      # The Chroma image includes Bash, but no curl, wget or Python.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8000; printf "GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; read -r response <&3; [[ "$$response" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentictm-local-network

  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-agentic-tm}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-agentic-tm}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agentictm-local-network


volumes:
  chroma_data:
  pg_data:

networks:
  agentictm-local-network:
    driver: bridge
