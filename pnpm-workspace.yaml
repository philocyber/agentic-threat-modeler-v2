confirmModulesPurge: false

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: false
ignoredBuiltDependencies:
  - unrs-resolver

# NOTE: pnpm v11 no longer reads the `pnpm` field from package.json; all
# resolution overrides must live here (see https://pnpm.io/settings#overrides).
overrides:
  # @langchain/aws pins AWS clients that still resolve @aws-sdk/core 3.977.3,
  # deprecated for a JSON document number-parsing bug (aws-sdk-js-v3#8246).
  "@aws-sdk/core": "3.977.7"
  "@babel/core": "7.29.7"
  dompurify: "3.4.15"
  postcss: "8.5.25"
  sharp: "0.35.4"
  uuid: "11.1.1"

  # connect-node 1.x imports only the standards-compatible Headers polyfill.
  # Covered by the local transport contract test; remove when upstream updates.
  "@connectrpc/connect-node@1>undici": "6.28.0"
  nanoid: "3.3.18"

  # Development tooling advisories; keep legacy CommonJS consumers on 1.x.
  "brace-expansion@1": "1.1.18"
  "brace-expansion@4": "5.0.9"
  "brace-expansion@5": "5.0.9"
  "js-yaml@4": "4.3.2"
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
